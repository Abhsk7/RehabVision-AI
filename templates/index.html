<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RehabVision AI - Universal Rehabilitation Monitor</title>
    <!-- Google MediaPipe Vision Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
            color: white;
            font-weight: 800;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }

        .video-panel {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 720px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #0b1120;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 5;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.25rem;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.9rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .highlight-green { color: var(--accent-green); }
        .highlight-cyan { color: var(--accent-cyan); }
        .highlight-orange { color: var(--accent-orange); }

        .posture-display {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 0.75rem;
            text-align: center;
        }

        .posture-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #475569;
            transform: translateY(-1px);
        }

        .btn-active {
            background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
            color: white;
        }

        .btn-reset {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reset:hover {
            background-color: #ef4444;
            color: white;
        }

        .btn-pdf {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: white;
            margin-top: 0.4rem;
        }

        .btn-pdf:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <div class="logo-badge">RV</div>
            <div class="logo-title">RehabVision AI</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="status-text">Starting Camera...</span>
        </div>
    </header>

    <div class="container">
        <!-- Live Visitor Webcam Panel -->
        <div class="video-panel">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output_canvas"></canvas>
            </div>
        </div>

        <!-- Telemetry & Controls Sidebar -->
        <div class="sidebar">
            <div class="card">
                <div class="card-title">Session Telemetry</div>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-label">REPETITIONS</div>
                        <div class="stat-value highlight-green" id="stat-reps">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">CURRENT ANGLE</div>
                        <div class="stat-value highlight-cyan" id="stat-angle">0°</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">PHASE</div>
                        <div class="stat-value" id="stat-stage" style="font-size: 1.1rem; padding-top: 0.4rem;">EXTENDED</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">BEST ROM</div>
                        <div class="stat-value highlight-orange" id="stat-rom">180°</div>
                    </div>
                </div>

                <div class="posture-display">
                    <div class="stat-label">CLINICAL POSTURE ASSESSMENT</div>
                    <div class="posture-text" id="stat-posture">Allow camera permission</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Exercise Controls & Export</div>
                <div class="controls-group">
                    <button class="btn btn-active" id="btn-arm" onclick="setMode('ARM')">
                        💪 Arm Mode (Bicep Curl)
                    </button>
                    <button class="btn" id="btn-knee" onclick="setMode('KNEE')">
                        🦵 Knee Mode (Extension / Squat)
                    </button>
                    <button class="btn btn-reset" onclick="resetStats()">
                        🔄 Reset Session Stats
                    </button>
                    <button class="btn btn-pdf" onclick="exportPDF()">
                        📄 Export Clinical PDF Report
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        RehabVision AI — Universal Clinical Rehabilitation Monitor
    </footer>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const canvasCtx = canvas.getContext("2d");
        const statusText = document.getElementById("status-text");

        let poseLandmarker = null;
        let currentMode = "ARM";
        let reps = 0;
        let stage = "EXTENDED";
        let bestROM = 180.0;
        let currentAngle = 0.0;
        let posture = "Stand in front of camera";
        let smoothedAngle = null;
        let trackedSide = "Detected";

        // Exponential Moving Average (EMA) Denoising Filter
        function smooth(rawAngle, alpha = 0.35) {
            if (smoothedAngle === null) {
                smoothedAngle = rawAngle;
            } else {
                smoothedAngle = (alpha * rawAngle) + ((1.0 - alpha) * smoothedAngle);
            }
            return Math.round(smoothedAngle * 10) / 10;
        }

        // Vector Angle Calculation using Math.atan2
        function calculateAngle(a, b, c) {
            const radA = Math.atan2(a.y - b.y, a.x - b.x);
            const radC = Math.atan2(c.y - b.y, c.x - b.x);
            let angle = Math.abs((radA - radC) * (180.0 / Math.PI));
            if (angle > 180.0) angle = 360.0 - angle;
            return Math.round(angle * 10) / 10;
        }

        function classifyElbow(angle) {
            if (angle >= 155.0) return "Arm Straight / Full Extension";
            if (angle >= 75.0) return "Half Flexion (90° Bend)";
            return "Full Flexion (Bicep Curl)";
        }

        function classifyKnee(angle) {
            if (angle >= 165.0) return "Standing Straight / Full Extension";
            if (angle >= 135.0) return "Quarter Squat (Gentle Rehab)";
            if (angle >= 90.0) return "Half Squat (Functional Strength)";
            return "Deep Squat (High Flexion)";
        }

        function updateExercise(angle) {
            const flexionThreshold = (currentMode === "ARM") ? 70.0 : 100.0;
            const extensionThreshold = (currentMode === "ARM") ? 150.0 : 160.0;

            if (angle >= extensionThreshold) {
                if (stage === "FLEXED") reps += 1;
                stage = "EXTENDED";
            } else if (angle <= flexionThreshold) {
                stage = "FLEXED";
                if (angle < bestROM) bestROM = angle;
            }
        }

        // 1. START VISITOR CAMERA IMMEDIATELY
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720, facingMode: "user" },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    statusText.innerText = "Camera Active • Initializing AI...";
                    loadMediaPipe();
                };
            } catch (err) {
                statusText.innerText = "Camera Permission Needed";
                alert("Please click 'Allow' when your browser asks for camera access!");
            }
        }

        // 2. LOAD MEDIAPIPE IN BACKGROUND
        async function loadMediaPipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1
                });
                statusText.innerText = "AI Kinematics Engine Live";
                predictLoop();
            } catch (err) {
                console.error("AI Load Error:", err);
                statusText.innerText = "AI Ready (Standard Mode)";
                predictLoop();
            }
        }

        let lastVideoTime = -1;
        // 3. MAIN PREDICTION & DRAWING LOOP
        function predictLoop() {
            if (video.currentTime !== lastVideoTime && poseLandmarker) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();
                const results = poseLandmarker.detectForVideo(video, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                if (results.landmarks && results.landmarks.length > 0) {
                    const landmarks = results.landmarks[0];
                    const drawingUtils = new DrawingUtils(canvasCtx);

                    drawingUtils.drawLandmarks(landmarks, { radius: 4, color: "#00FF00", lineWidth: 2 });
                    drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: "#06B6D4", lineWidth: 3 });

                    let p1, p2, p3;
                    const w = canvas.width;
                    const h = canvas.height;

                    if (currentMode === "ARM") {
                        const leftScore = (landmarks[11].visibility || 1) + (landmarks[13].visibility || 1) + (landmarks[15].visibility || 1);
                        const rightScore = (landmarks[12].visibility || 1) + (landmarks[14].visibility || 1) + (landmarks[16].visibility || 1);
                        const isLeft = leftScore >= rightScore;
                        trackedSide = isLeft ? "Left Arm" : "Right Arm";
                        p1 = landmarks[isLeft ? 11 : 12];
                        p2 = landmarks[isLeft ? 13 : 14];
                        p3 = landmarks[isLeft ? 15 : 16];
                    } else {
                        const leftScore = (landmarks[23].visibility || 1) + (landmarks[25].visibility || 1) + (landmarks[27].visibility || 1);
                        const rightScore = (landmarks[24].visibility || 1) + (landmarks[26].visibility || 1) + (landmarks[28].visibility || 1);
                        const isLeft = leftScore >= rightScore;
                        trackedSide = isLeft ? "Left Leg" : "Right Leg";
                        p1 = landmarks[isLeft ? 23 : 24];
                        p2 = landmarks[isLeft ? 25 : 26];
                        p3 = landmarks[isLeft ? 27 : 28];
                    }

                    if (p1 && p2 && p3) {
                        const pt1 = { x: p1.x * w, y: p1.y * h };
                        const pt2 = { x: p2.x * w, y: p2.y * h };
                        const pt3 = { x: p3.x * w, y: p3.y * h };

                        const rawAngle = calculateAngle(pt1, pt2, pt3);
                        currentAngle = smooth(rawAngle);
                        posture = (currentMode === "ARM") ? classifyElbow(currentAngle) : classifyKnee(currentAngle);
                        updateExercise(currentAngle);

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(pt1.x, pt1.y);
                        canvasCtx.lineTo(pt2.x, pt2.y);
                        canvasCtx.lineTo(pt3.x, pt3.y);
                        canvasCtx.strokeStyle = "#FFFF00";
                        canvasCtx.lineWidth = 6;
                        canvasCtx.stroke();
                    }

                    document.getElementById("stat-reps").innerText = reps;
                    document.getElementById("stat-angle").innerText = currentAngle + "°";
                    document.getElementById("stat-stage").innerText = stage;
                    document.getElementById("stat-rom").innerText = bestROM + "°";
                    document.getElementById("stat-posture").innerText = posture;
                }
                canvasCtx.restore();
            }
            window.requestAnimationFrame(predictLoop);
        }

        // Auto-start camera as soon as page opens!
        startCamera();

        window.setMode = function(mode) {
            currentMode = mode;
            smoothedAngle = null;
            document.getElementById("btn-arm").classList.toggle("btn-active", mode === "ARM");
            document.getElementById("btn-knee").classList.toggle("btn-active", mode === "KNEE");
        };

        window.resetStats = function() {
            reps = 0;
            stage = "EXTENDED";
            bestROM = 180.0;
            document.getElementById("stat-reps").innerText = reps;
            document.getElementById("stat-rom").innerText = bestROM + "°";
        };

        window.exportPDF = function() {
            const params = new URLSearchParams({
                reps: reps,
                angle: currentAngle,
                best_rom: bestROM,
                mode: currentMode,
                posture: posture,
                side: trackedSide
            });
            window.location.href = `/download_report?${params.toString()}`;
        };
    </script>
</body>
</html>
